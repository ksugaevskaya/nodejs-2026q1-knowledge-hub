version: '3.9'

services:
  app:
    build:
      context: .
      args:
        DATABASE_URL: ${DATABASE_URL_DOCKER}
    container_name: knowledge-hub-api
    depends_on:
      db:
        condition: service_healthy
      vectordb:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER}
    ports:
      - '4000:4000'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'timeout 1 bash -c "cat < /dev/null > /dev/tcp/localhost/4000"',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: on-failure
    networks:
      - app-network

  db:
    image: postgres:16-alpine
    container_name: knowledge-hub-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - app-network

  vectordb:
    image: qdrant/qdrant:latest
    container_name: knowledge-hub-vectordb
    ports:
      - '6333:6333'
      - '6334:6334'
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'timeout 1 bash -c "cat < /dev/null > /dev/tcp/localhost/6333"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - app-network

  adminer:
    image: adminer:latest
    container_name: knowledge-hub-adminer
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - debug
    ports:
      - '8080:8080'
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  qdrant_data:
